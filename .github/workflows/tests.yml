# Runs the unit tests on every push and pull request.
# The tests use a fake model client, so no API key or secrets are needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the README supports, and a current one.
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Check the benchmark still runs (offline estimate, 12 turns)
        run: python benchmarks/token_benchmark.py --estimate --turns 12

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so every commit gets scanned

      # Same scanner as the pre-commit hook. The local hook can be skipped
      # (git commit --no-verify) or never installed; this check can't.
      - name: Scan for committed secrets with gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  docker:
    runs-on: ubuntu-latest
    env:
      # Tag the image with the commit it was built from, never just "latest",
      # so it's always clear exactly which code an image contains.
      IMAGE: study-agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t "$IMAGE" .

      # A smoke test that needs no API key: inside the container, import the
      # agent (proves dependencies installed), list the sample files and the
      # skills (proves they were copied), and confirm it isn't running as root.
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c "
          import os, agent
          print(agent.FileTools('sample_docs').list_files())
          print(agent.skills_index())
          assert os.getuid() != 0, 'container is running as root'
          "

      - name: Check it refuses to start without an API key
        run: |
          if docker run --rm "$IMAGE"; then
            echo "expected a non-zero exit without ANTHROPIC_API_KEY"; exit 1
          fi
