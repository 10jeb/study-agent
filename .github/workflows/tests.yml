# Runs the unit tests on every push and pull request.
# The tests use a fake model client, so no API key or secrets are needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the README supports, and a current one.
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Check the benchmark still runs (offline estimate, 12 turns)
        run: python benchmarks/token_benchmark.py --estimate --turns 12
